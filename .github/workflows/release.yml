name: Daily release

on:
  schedule:
    # GitHub Actions cron uses UTC. Run daily away from the top of the hour.
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # npm Trusted Publishing exchanges this GitHub OIDC identity for a
  # short-lived publish credential. Do not add an npm token secret.
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      source_head: ${{ steps.check.outputs.source_head }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Check for commits after the latest release tag
        id: check
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          echo "source_head=${source_head}" >> "$GITHUB_OUTPUT"
          latest_tag="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "$latest_tag" ]]; then
            echo "::error::No SemVer release tag found; create the baseline release tag before running this workflow"
            exit 1
          fi
          if [[ "$source_head" == "$(git rev-parse "refs/tags/${latest_tag}^{commit}")" ]]; then
            echo "HEAD is already at latest release tag ${latest_tag}; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify checked commit
        shell: bash
        env:
          SOURCE_HEAD: ${{ needs.check.outputs.source_head }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_HEAD" ]]; then
            echo "::error::Default branch advanced after the release check; retry the workflow"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install npm with OIDC support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install editors
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim vim

      - name: Download coc.nvim release branch
        shell: bash
        run: |
          set -euo pipefail

          archive="$(mktemp "${RUNNER_TEMP}/coc.nvim.release.XXXXXX.tar.gz")"
          coc_path="$(mktemp -d "${RUNNER_TEMP}/coc.nvim.release.XXXXXX")"
          trap 'rm -f "$archive"' EXIT

          curl --fail --location --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$archive" \
            https://api.github.com/repos/neoclide/coc.nvim/tarball/release
          tar -xzf "$archive" --strip-components=1 -C "$coc_path"
          printf 'COC_TEST_COC_PATH=%s\n' "$coc_path" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build integration server
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp "${RUNNER_TEMP}/vimls-go.XXXXXX.tar.gz")"
          server_path="$(mktemp -d "${RUNNER_TEMP}/vimls-go.XXXXXX")"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$archive" \
            https://api.github.com/repos/neoclide/vimls-go/tarball/0b8c90c86b32e2e7af86ffaa128dff6d72a36656
          tar -xzf "$archive" --strip-components=1 -C "$server_path"
          mkdir -p "$server_path/bin"
          go -C "$server_path" build -o "$server_path/bin/vimls" ./cmd/vimls
          printf 'VIMLS_TEST_BIN=%s\n' "$server_path/bin" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Test Vim
        run: npm run test:vim

      - name: Plan release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          current_version="$(node -p "require('./package.json').version")"

          # Baseline is the newest bare stable SemVer release tag, not
          # necessarily package.json#version: a maintainer may have bumped the
          # version manually between releases, skipping intermediate numbers.
          previous_tag="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "$previous_tag" ]]; then
            echo "::error::No SemVer release tag found; create the baseline release tag before running this workflow"
            exit 1
          fi
          # Keep the original tag name for git operations; strip any "v" prefix
          # only for version comparison with package.json.
          previous_version="${previous_tag#v}"

          if ! git merge-base --is-ancestor "$previous_tag" HEAD; then
            echo "::error::Release tag ${previous_tag} is not an ancestor of HEAD"
            exit 1
          fi

          if [[ "$current_version" != "$previous_version" ]]; then
            # Manifest version differs from the latest tag: either a manual
            # version bump (release it as-is) or a regression (reject it).
            if [[ "$(printf '%s\n%s\n' "$current_version" "$previous_version" | sort -V | tail -n 1)" != "$current_version" ]]; then
              echo "::error::package.json version ${current_version} is older than latest release tag ${previous_tag}"
              exit 1
            fi
            if git rev-parse --verify --quiet "refs/tags/${current_version}^{commit}" >/dev/null; then
              echo "::error::Release tag ${current_version} already exists; inspect remote branch/tag divergence"
              exit 1
            fi
            echo "Manifest version ${current_version} is newer than tag ${previous_tag}; releasing the bumped version directly."
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=${current_version}" >> "$GITHUB_OUTPUT"
            echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          published_version="$(npm view "$package_name" version)"
          if [[ "$published_version" != "$current_version" ]]; then
            echo "::error::package.json version ${current_version} does not match npm latest ${published_version}"
            exit 1
          fi
          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

      - name: Update version and history
        if: steps.release.outputs.mode == 'release'
        id: prepare
        env:
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          PLANNED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$PREVIOUS_TAG"
          if [[ -n "$PLANNED_VERSION" ]]; then
            # Version already set by package.json (manual bump / skip-level
            # release); do not increment it again.
            version="$PLANNED_VERSION"
          else
            version="$(npm version patch --no-git-tag-version)"
          fi
          version="${version#v}"

          if git rev-parse --verify --quiet "refs/tags/${version}^{commit}" >/dev/null; then
            echo "::error::Release tag ${version} already exists; inspect remote branch/tag divergence"
            exit 1
          fi

          release_notes="$(mktemp)"
          updated_history="$(mktemp)"
          git log --format='- %s (%h)' "${previous_tag}..HEAD" > "$release_notes"
          {
            printf '## %s\n\n' "$version"
            cat "$release_notes"
            if [[ -s history.md ]]; then
              printf '\n'
              cat history.md
            fi
          } > "$updated_history"
          mv "$updated_history" history.md

          npm pack --dry-run

          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" ]]; then
            echo "::error::git commit -a would omit untracked files:"
            printf '%s\n' "$untracked"
            exit 1
          fi

          git diff --check
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        if: steps.release.outputs.mode == 'release'
        shell: bash
        run: |
          set -euo pipefail

          version="$RELEASE_VERSION"
          default_branch="$DEFAULT_BRANCH"
          source_head="$(git rev-parse HEAD)"
          git fetch --quiet origin "$default_branch"
          remote_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_head" != "$source_head" ]]; then
            echo "::error::Default branch advanced during this run; retry from ${remote_head}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -a -m "Release $version"
          git tag -a "$version" -m "Release $version"
          git push --tags
          git push

      - name: Publish to npm
        if: steps.release.outputs.mode == 'release'
        # Authentication is provided exclusively by npm Trusted Publishing
        # through GitHub OIDC; this workflow must not use NODE_AUTH_TOKEN.
        run: npm publish
