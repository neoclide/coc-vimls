name: Test

on:
  push:
  pull_request:

jobs:
  integration:
    name: coc-test (${{ matrix.editor }})
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    strategy:
      fail-fast: false
      matrix:
        editor: [nvim, vim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install editors
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim build-essential libncurses-dev
      # Buffer :source needs patch 9.1.0359 to preserve filenames and relative
      # imports. Neovim also needs this Vim for external Vim9 execution.
      - uses: actions/checkout@v4
        with:
          repository: vim/vim
          ref: 5ab969f719bb09555e90e8dff8c94fc37bcbf2ae # v9.2.1015
          path: .vim
      - name: Build Vim
        run: |
          # Keep thousands of unrelated Vim source fixtures out of the test workspace.
          mv .vim "$RUNNER_TEMP/vim-src"
          cd "$RUNNER_TEMP/vim-src"
          ./configure --with-features=huge --enable-gui=no --without-x --prefix="$RUNNER_TEMP/vim"
          make -j2
          make install
          echo "$RUNNER_TEMP/vim/bin" >> "$GITHUB_PATH"
      - name: Check editor versions
        run: |
          vim --version
          nvim --version
      - uses: actions/checkout@v4
        with:
          repository: neoclide/vimls-go
          ref: 0b8c90c86b32e2e7af86ffaa128dff6d72a36656
          path: .vimls-go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build integration server
        run: |
          mkdir -p .test-bin
          cd .vimls-go
          go build -o ../.test-bin/vimls ./cmd/vimls
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:${{ matrix.editor }}
